name: Import WinForms MVP sources
on:
  push:
    paths:
      - SOURCE_READY.txt
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract staged project sources
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap-src.part* | base64 -d > /tmp/garimpo-da-vez-studio.tar.xz
          tar -xJf /tmp/garimpo-da-vez-studio.tar.xz
          rm -f bootstrap-src.part* SOURCE_READY.txt
          rm -f .github/workflows/import-sources.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import Garimpo da Vez Studio WinForms MVP'
          git push origin HEAD:main
