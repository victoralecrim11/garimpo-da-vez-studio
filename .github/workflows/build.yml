name: Build WinForms (.NET 10)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python bridge contract tests (offline)
        run: python -m unittest discover -s integration/tests -v
      - name: Validar o gerador de CSV histórico sem acessar a rede
        run: python -m unittest discover -s tools/catalogo -p "test_*.py" -v
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore GarimpoDaVezStudio.csproj
      - name: Build
        run: dotnet build GarimpoDaVezStudio.csproj -c Release --no-restore
      - name: Validate product field types
        run: dotnet run --project Tests/InputValidation/InputValidationTests.csproj -c Release
      - name: Verify product suggestion text in WinForms
        run: dotnet run --project Tests/SuggestionDisplay/SuggestionDisplayTests.csproj -c Release
      - name: Test hybrid catalog CSV, Excel and SQLite
        run: dotnet run --project Tests/Catalog/CatalogTests.csproj -c Release
      - name: Verificar abertura e layout responsivo do WinForms
        run: dotnet run --project Tests/LayoutSmoke/LayoutSmoke.csproj -c Release
      - name: Compilar importador CLI de catálogo
        run: dotnet build tools/CatalogImport/CatalogImport.csproj -c Release
