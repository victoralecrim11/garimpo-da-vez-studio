name: Build WinForms (.NET 10)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore GarimpoDaVezStudio.csproj
      - name: Build
        run: dotnet build GarimpoDaVezStudio.csproj -c Release --no-restore
